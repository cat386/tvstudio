[package]
name = "tvstudio"
version = "0.1.0"
edition = "2021"
description = "TV Studio — среда визуальной разработки текстовых приложений на tvision-rs"
license = "MIT"

[dependencies]
emojis-rs = "0.1.3"
tvision-rs = { git = "https://github.com/cat386/tvision-rs" }

[lib]
name = "tvstudio"
path = "src/lib.rs"

[[bin]]
name = "tvstudio"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"
